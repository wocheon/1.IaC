apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-node-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-node-1
  template:
    metadata:
      labels:
        app: nginx-node-1
    spec:
      nodeSelector:
        deploy-test: node-1
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80

