---
kubernetes_repository_minor: "1.36"
kubernetes_package_version: ""
kubernetes_disable_swap: true
kubernetes_cri_socket: unix:///run/containerd/containerd.sock
# GCE FQDN의 첫 label인 VM short hostname을 Kubernetes Node 이름으로 사용한다.
kubernetes_node_name: "{{ ansible_nodename.split('.')[0] }}"
kubernetes_containerd_config_path: /etc/containerd/config.toml
kubernetes_containerd_systemd_cgroup: true
kubernetes_hold_packages: true
kubernetes_required_kernel_modules:
  - overlay
  - br_netfilter
kubernetes_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
kubernetes_verify_installation: true
