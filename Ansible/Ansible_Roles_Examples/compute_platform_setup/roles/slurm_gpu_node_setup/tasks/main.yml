---
- name: "Slurm GPU Node Setup Role 입력 검증"
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups.get('slurm_compute', [])
    fail_msg: >-
      GPU 노드는 같은 hostname으로 slurm_compute와 slurm_gpu_compute 양쪽에 등록해야 합니다.
    quiet: true

- name: "Slurm GPU 공통 기반 구성"
  ansible.builtin.include_role:
    name: gpu_common
    public: true
  vars:
    gpu_common_install_driver: "{{ gpu_install_driver | bool }}"
    gpu_common_install_cuda: "{{ gpu_install_cuda | bool }}"
    gpu_common_install_cudnn: "{{ gpu_install_cudnn | bool }}"
    gpu_common_install_nvidia_container_toolkit: false

- name: "GPU Driver 재부팅 완료 확인"
  ansible.builtin.assert:
    that:
      - not (gpu_reboot_required | default(false) | bool)
    fail_msg: "GPU 노드 재부팅이 필요합니다. 재부팅 후 slurm_gpu_node_setup.yaml을 다시 실행하세요."
  when: not ansible_check_mode

- name: "Slurm Host DCGM 구성 (선택)"
  ansible.builtin.include_tasks: dcgm.yml
  when: gpu_install_dcgm | bool

- name: "Slurm GPU 노드 준비 완료"
  ansible.builtin.debug:
    msg: >-
      NVIDIA Driver, CUDA와 선택적 DCGM 준비가 완료되었습니다.
      다음 단계로 slurm_cluster_setup.yaml을 실행하세요.
