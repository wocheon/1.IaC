---
- name: "Kubernetes 테스트 디렉토리 생성"
  ansible.builtin.file:
    path: "{{ kubernetes_test_dir }}"
    state: directory
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ getent_passwd[kubernetes_admin_user][2] }}"
    mode: "0755"

- name: "Kubernetes 테스트 파일 복사"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ kubernetes_test_dir }}/{{ item | basename }}"
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ getent_passwd[kubernetes_admin_user][2] }}"
    mode: "{{ '0755' if item.endswith('.sh') else '0644' }}"
  loop: "{{ query('ansible.builtin.fileglob', role_path + '/../../test/kubernetes/*') }}"
  loop_control:
    label: "{{ item | basename }}"
