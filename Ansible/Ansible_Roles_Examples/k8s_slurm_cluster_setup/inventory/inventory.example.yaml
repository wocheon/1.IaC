---
all:
  children:
    kubernetes_cluster:
      children:
        kubernetes_control_plane:
          hosts:
            k8s-cp-01:
              # RFC 5737 문서용 주소. 실제 주소로 변경한다.
              ansible_host: 192.0.2.10
              kubernetes_node_ip: 192.0.2.10
        kubernetes_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 192.0.2.11
              kubernetes_node_ip: 192.0.2.11

    slurm_cluster:
      children:
        slurm_controllers:
          hosts:
            slurm-controller-01:
              ansible_host: 192.0.2.20
        slurm_compute:
          hosts:
            slurm-compute-01:
              ansible_host: 192.0.2.21
              # 생략하면 gathered facts를 사용한다. 운영 환경은 명시 권장.
              slurm_cpus: 16
              slurm_real_memory: 60000
              slurm_gres: ""

