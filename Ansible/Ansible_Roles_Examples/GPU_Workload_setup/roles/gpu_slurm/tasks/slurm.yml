---
# ==========================================================================
# Slurm GPU Compute Node 설정
#
# 이 Role 의 책임 범위
#   O  gres.conf 의 GPU 정의
#   O  (선택) cgroup.conf 의 GPU device constrain 설정
#   X  Slurm 설치 / slurm.conf / Controller(slurmctld) 구성
#
# 기존 운영 설정을 보호하기 위해
#   - cgroup.conf 는 기본적으로 관리하지 않는다 (slurm_manage_cgroup_conf: false)
#   - 파일 변경 시 backup 을 남긴다
#   - slurmd 재시작은 명시적으로 허용한 경우에만 수행한다 (slurm_restart_daemon)
#
# [주의] slurm.conf 의 NodeName 항목에 Gres=gpu:<type>:<count> 를 추가하는 것은
#        Controller 측 작업이므로 이 Role 이 수행하지 않는다.
# ==========================================================================

- name: "GPU 모델명 조회"
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=name --format=csv,noheader
  register: _gpu_slurm_smi
  changed_when: false
  failed_when: false
  check_mode: false

- name: "GPU 개수 / 타입 결정"
  ansible.builtin.set_fact:
    _gpu_slurm_count: >-
      {{ slurm_gpu_count if (slurm_gpu_count | int) > 0
         else (_gpu_slurm_smi.stdout_lines | default([]) | length) }}
    _gpu_slurm_type: >-
      {{ slurm_gpu_type if slurm_gpu_type | length > 0
         else ((_gpu_slurm_smi.stdout_lines | default([]) | first | default(''))
               | regex_replace('^NVIDIA\s+', '')
               | regex_replace('[^A-Za-z0-9]+', '_')
               | lower) }}

- name: "AutoDetect=off 사용 시 GPU 감지 결과 검증"
  ansible.builtin.assert:
    that:
      - (_gpu_slurm_count | int) > 0
      - _gpu_slurm_type | length > 0
    fail_msg: >-
      slurm_gres_autodetect=off 이지만 GPU 개수/타입을 확인할 수 없습니다.
      slurm_gpu_count 와 slurm_gpu_type 을 명시적으로 지정하세요.
    quiet: true
  when: slurm_gres_autodetect == 'off'

- name: "Slurm 설정 디렉토리 확인"
  ansible.builtin.file:
    path: "{{ slurm_gres_config_path | dirname }}"
    state: directory
    owner: "{{ slurm_config_owner }}"
    group: "{{ slurm_config_group }}"
    mode: "0755"

- name: "gres.conf 생성"
  ansible.builtin.template:
    src: gres.conf.j2
    dest: "{{ slurm_gres_config_path }}"
    owner: "{{ slurm_config_owner }}"
    group: "{{ slurm_config_group }}"
    mode: "{{ slurm_config_mode }}"
    backup: true
  when: slurm_manage_gres_conf | bool
  notify: restart slurmd

- name: "cgroup.conf 생성 (명시적으로 활성화한 경우에만)"
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: "{{ slurm_cgroup_config_path }}"
    owner: "{{ slurm_config_owner }}"
    group: "{{ slurm_config_group }}"
    mode: "{{ slurm_config_mode }}"
    backup: true
  when: slurm_manage_cgroup_conf | bool
  notify: restart slurmd

- name: "Slurm Controller 측 작업 안내"
  ansible.builtin.debug:
    msg:
      - "이 노드의 GPU 구성: type={{ _gpu_slurm_type | default('unknown') }}, count={{ _gpu_slurm_count | default(0) }}"
      - "Controller 의 slurm.conf 에 다음 항목이 필요합니다."
      - "  GresTypes=gpu"
      - "  NodeName={{ inventory_hostname_short }} Gres=gpu:{{ _gpu_slurm_type | default('gpu') }}:{{ _gpu_slurm_count | default(0) }} ..."
      - "설정 반영에는 slurmd 재시작이 필요합니다 (slurm_restart_daemon={{ slurm_restart_daemon }})."
