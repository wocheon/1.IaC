---
- name: "Slurm GPU Role 입력 검증"
  ansible.builtin.assert:
    that:
      - slurm_gres_autodetect in ['nvml', 'nvidia-smi', 'off']
    fail_msg: "slurm_gres_autodetect는 nvml, nvidia-smi, off 중 하나여야 합니다."
    quiet: true

- name: "Slurm GPU 공통 기반 구성"
  ansible.builtin.include_role:
    name: gpu_common
    public: true
  vars:
    gpu_common_install_driver: "{{ gpu_install_driver | bool }}"
    gpu_common_install_cuda: "{{ gpu_install_cuda | bool }}"
    gpu_common_install_cudnn: "{{ gpu_install_cudnn | bool }}"
    gpu_common_install_nvidia_container_toolkit: false

- name: "Slurm GPU Compute Node 구성"
  ansible.builtin.include_tasks: slurm.yml

- name: "Slurm Host DCGM 구성 (선택)"
  ansible.builtin.include_tasks: dcgm.yml
  when: gpu_install_dcgm | bool

- name: "Slurm handler 실행"
  ansible.builtin.meta: flush_handlers

- name: "Slurm GPU 환경 검증"
  ansible.builtin.include_tasks: verify.yml
  when: gpu_verify_installation | bool
