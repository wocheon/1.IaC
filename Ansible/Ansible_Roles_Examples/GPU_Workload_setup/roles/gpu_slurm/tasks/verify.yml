---
- name: "검증: gres.conf"
  ansible.builtin.stat:
    path: "{{ slurm_gres_config_path }}"
  register: _gpu_slurm_v_gres
  when: slurm_manage_gres_conf | bool

- name: "검증: cgroup.conf"
  ansible.builtin.stat:
    path: "{{ slurm_cgroup_config_path }}"
  register: _gpu_slurm_v_cgroup
  when: slurm_manage_cgroup_conf | bool

- name: "Slurm 검증 실패 항목 집계"
  ansible.builtin.set_fact:
    _gpu_slurm_verify_failures: >-
      {{
        ([] if (_gpu_slurm_v_gres.skipped | default(false)) or
                 (_gpu_slurm_v_gres.stat.exists | default(false))
           else ['gres.conf가 없습니다: ' ~ slurm_gres_config_path])
        + ([] if (_gpu_slurm_v_cgroup.skipped | default(false)) or
                 (_gpu_slurm_v_cgroup.stat.exists | default(false))
           else ['cgroup.conf가 없습니다: ' ~ slurm_cgroup_config_path])
      }}

- name: "Slurm 검증 결과"
  ansible.builtin.debug:
    msg:
      - "gres.conf   : {{ _gpu_slurm_v_gres.stat.exists | default('not managed') }}"
      - "cgroup.conf : {{ _gpu_slurm_v_cgroup.stat.exists | default('not managed') }}"

- name: "Slurm 검증 실패 경고"
  ansible.builtin.debug:
    msg: "[검증 경고] {{ _gpu_slurm_verify_failures }}"
  when:
    - _gpu_slurm_verify_failures | length > 0
    - not (gpu_verify_fail_on_error | bool)

- name: "Slurm 검증 실패 시 중단"
  ansible.builtin.fail:
    msg: "Slurm GPU 환경 검증 실패: {{ _gpu_slurm_verify_failures }}"
  when:
    - _gpu_slurm_verify_failures | length > 0
    - gpu_verify_fail_on_error | bool
