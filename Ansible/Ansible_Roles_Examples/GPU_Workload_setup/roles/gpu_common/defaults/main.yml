---
# gpu_common은 네 개의 환경 Role이 공유하는 호스트 GPU 기반을 구성한다.
gpu_common_install_driver: true
gpu_common_install_cuda: false
gpu_common_install_cudnn: false
gpu_common_install_nvidia_container_toolkit: false
gpu_common_verify_driver: true

gpu_supported_distributions:
  - Ubuntu
gpu_supported_ubuntu_versions:
  - "20.04"
  - "22.04"
  - "24.04"
gpu_supported_architectures:
  - x86_64
  - aarch64

gpu_apt_cache_valid_time: 3600
gpu_require_nvidia_device: false
gpu_preflight_enabled: true
gpu_preflight_min_root_free_gb: 10
gpu_preflight_fail_on_low_disk: false
gpu_cuda_min_driver_branches:
  "11": 450
  "12": 525
  "13": 580
gpu_allow_reboot: false
gpu_reboot_timeout: 600
gpu_verify_installation: true
gpu_verify_fail_on_error: true

nvidia_driver_version: "560"
nvidia_driver_flavor: ""
nvidia_driver_source: cuda_repo
nvidia_driver_package: "nvidia-driver-{{ nvidia_driver_version }}{{ nvidia_driver_flavor }}"
nvidia_blacklist_nouveau: true
nvidia_enable_persistenced: false
nvidia_repo_keyring_version: "1.1-1"

cuda_version: "12.6"
cuda_package: "cuda-toolkit-{{ cuda_version | replace('.', '-') }}"
cuda_install_path: "/usr/local/cuda-{{ cuda_version }}"
cuda_manage_profile_d: true

cudnn_version: ""
cudnn_package: "cudnn9-cuda-{{ cuda_version.split('.')[0] }}"

nvidia_container_toolkit_version: ""
nvidia_container_toolkit_channel: stable
