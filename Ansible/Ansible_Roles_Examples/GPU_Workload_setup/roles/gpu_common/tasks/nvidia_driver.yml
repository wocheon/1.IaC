---
# ==========================================================================
# NVIDIA Driver 설치
#
# [DISRUPTIVE] 드라이버 설치/업그레이드는 커널 모듈을 교체하므로
#              실행 중인 GPU workload 에 영향을 줄 수 있다.
#              이 Role 은 절대 자동으로 reboot 하지 않는다.
#              (gpu_allow_reboot=true 인 경우에만 재부팅)
# ==========================================================================

- name: "NVIDIA apt repository 등록"
  ansible.builtin.include_tasks: nvidia_repo.yml
  when:
    - nvidia_driver_source == 'cuda_repo'
    - not (_gpu_nvidia_repo_configured | default(false) | bool)

- name: "커널 헤더 / 빌드 도구 설치"
  ansible.builtin.apt:
    name:
      - "linux-headers-{{ ansible_facts['kernel'] }}"
      - dkms
      - build-essential
    state: present

- name: "설치 전 드라이버 상태 확인"
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: _gpu_smi_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: "nouveau 드라이버 blacklist 설정"
  ansible.builtin.template:
    src: blacklist-nouveau.conf.j2
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    owner: root
    group: root
    mode: "0644"
  register: _gpu_nouveau_blacklist
  when: nvidia_blacklist_nouveau | bool
  notify: update initramfs

- name: "NVIDIA Driver 패키지 설치 ({{ nvidia_driver_package }})"
  ansible.builtin.apt:
    name: "{{ nvidia_driver_package }}"
    state: present
    install_recommends: true
  register: _gpu_driver_install

- name: "nvidia-persistenced 서비스 활성화"
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: started
  when:
    - nvidia_enable_persistenced | bool
    - not (_gpu_driver_install is changed)   # 방금 설치한 경우 reboot 전에는 기동되지 않을 수 있다
  failed_when: false

- name: "커널 모듈 로드 상태 확인"
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: _gpu_smi_after
  changed_when: false
  failed_when: false
  check_mode: false

- name: "드라이버 적용을 위한 reboot 필요 여부 판정"
  ansible.builtin.set_fact:
    gpu_reboot_required: true
  when: >-
    (_gpu_driver_install is changed)
    or (_gpu_nouveau_blacklist is changed)
    or (_gpu_smi_after.rc != 0 and gpu_nvidia_device_present | bool)
    or (_gpu_smi_before.rc == 0 and _gpu_smi_after.rc == 0
        and _gpu_smi_before.stdout != _gpu_smi_after.stdout)
