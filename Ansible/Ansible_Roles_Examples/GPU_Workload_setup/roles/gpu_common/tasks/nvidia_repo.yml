---
# ==========================================================================
# [공통 / 재사용] NVIDIA CUDA apt repository 등록
# nvidia_driver.yml / cuda.yml / cudnn.yml 에서 include 하며,
# _gpu_nvidia_repo_configured fact 로 중복 실행을 방지한다.
#
# cuda-keyring 패키지가 GPG 키와 sources.list 항목을 함께 설치하므로
# 별도의 apt_key / apt_repository 조작이 필요 없고 idempotent 하다.
# ==========================================================================

- name: "cuda-keyring 패키지 다운로드"
  ansible.builtin.get_url:
    url: >-
      https://developer.download.nvidia.com/compute/cuda/repos/{{ _gpu_nvidia_repo_distro }}/{{ _gpu_nvidia_repo_arch }}/cuda-keyring_{{ nvidia_repo_keyring_version }}_all.deb
    dest: "/var/cache/apt/archives/cuda-keyring_{{ nvidia_repo_keyring_version }}_all.deb"
    owner: root
    group: root
    mode: "0644"
  register: _gpu_cuda_keyring_download

- name: "cuda-keyring 패키지 설치 (NVIDIA apt repository 등록)"
  ansible.builtin.apt:
    deb: "/var/cache/apt/archives/cuda-keyring_{{ nvidia_repo_keyring_version }}_all.deb"
    state: present
  register: _gpu_cuda_keyring_install

- name: "NVIDIA repository 추가 후 apt 캐시 갱신"
  ansible.builtin.apt:
    update_cache: true
  when: _gpu_cuda_keyring_install is changed

- name: "NVIDIA repository 설정 완료 표시"
  ansible.builtin.set_fact:
    _gpu_nvidia_repo_configured: true
