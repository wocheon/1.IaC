---
# ==========================================================================
# GPU 환경 공통 제어 변수
# 이 파일은 inventory/inventory.example.yaml 사용 시 모든 GPU 노드에 적용된다.
# 각 Role은 자신에게 필요한 변수만 사용한다.
# ==========================================================================

# --------------------------------------------------------------------------
# Ansible 접속
# --------------------------------------------------------------------------
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3

# --------------------------------------------------------------------------
# NVIDIA Driver / 공통 안전성
# --------------------------------------------------------------------------
gpu_install_driver: true
nvidia_driver_version: "560"
nvidia_driver_flavor: ""
nvidia_driver_source: cuda_repo
nvidia_blacklist_nouveau: true
nvidia_enable_persistenced: false

gpu_require_nvidia_device: false
gpu_preflight_enabled: true
gpu_preflight_min_root_free_gb: 10
gpu_preflight_fail_on_low_disk: false
gpu_allow_reboot: false
gpu_reboot_timeout: 600
gpu_verify_installation: true
gpu_verify_fail_on_error: true

# --------------------------------------------------------------------------
# CUDA / cuDNN
# gpu_standalone과 gpu_slurm에서 사용한다.
# gpu_docker와 gpu_kubernetes는 이 값과 무관하게 Host CUDA를 설치하지 않는다.
# --------------------------------------------------------------------------
gpu_install_cuda: true
cuda_version: "12.6"
gpu_install_cudnn: false
cudnn_version: ""

# --------------------------------------------------------------------------
# Standalone: Python / PyTorch / TensorFlow
# --------------------------------------------------------------------------
gpu_install_pytorch: true
gpu_install_tensorflow: false
gpu_python_version: "3"
gpu_python_venv_path: /opt/gpu-venv
gpu_python_venv_owner: root
gpu_python_venv_group: root
pytorch_version: ""
tensorflow_version: ""

# 선택적 Host DCGM (gpu_standalone, gpu_slurm)
gpu_install_dcgm: false
dcgm_cuda_major: "{{ cuda_version.split('.')[0] }}"
dcgm_package: "datacenter-gpu-manager-4-cuda{{ dcgm_cuda_major }}"
dcgm_service_name: nvidia-dcgm
# 진단은 GPU 자원을 사용하므로 workload를 비운 뒤에만 활성화한다.
dcgm_run_diagnostics: false
dcgm_diagnostic_level: "1"

# --------------------------------------------------------------------------
# Docker GPU Host
# --------------------------------------------------------------------------
gpu_install_nvidia_container_toolkit: true
nvidia_container_toolkit_version: ""
docker_users:
  - ubuntu
docker_manage_daemon_json: true
docker_default_runtime_nvidia: false
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 100m
    max-file: "3"

# 선택적 Docker DCGM Exporter. 활성화할 때 고정 image tag를 입력한다.
gpu_install_dcgm_exporter: false
dcgm_exporter_image: ""
dcgm_exporter_container_name: dcgm-exporter
dcgm_exporter_port: 9400
dcgm_exporter_service_name: gpu-dcgm-exporter

# --------------------------------------------------------------------------
# Kubernetes GPU Worker
# Cloud Provider가 Driver를 관리하면 true로 변경한다.
# DCGM/DCGM Exporter는 이 Node Role이 아닌 GPU Operator 또는 Helm이 관리한다.
# --------------------------------------------------------------------------
kubernetes_gpu_driver_managed: false
kubernetes_container_runtime: containerd
kubernetes_containerd_config_path: /etc/containerd/config.toml
kubernetes_set_nvidia_default_runtime: true
kubernetes_generate_containerd_config: true

# --------------------------------------------------------------------------
# Slurm GPU Compute Node
# --------------------------------------------------------------------------
slurm_gres_config_path: /etc/slurm/gres.conf
slurm_cgroup_config_path: /etc/slurm/cgroup.conf
slurm_manage_gres_conf: true
slurm_gres_autodetect: nvml
slurm_gpu_type: ""
slurm_gpu_count: 0

# 기존 Slurm 설정과 실행 중인 Job 보호를 위한 안전 기본값
slurm_manage_cgroup_conf: false
slurm_restart_daemon: false
slurm_daemon_service: slurmd
