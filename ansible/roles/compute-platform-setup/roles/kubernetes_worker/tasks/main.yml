---
- name: "Kubernetes worker 공통 기반 구성"
  ansible.builtin.include_role:
    name: kubernetes_common
    public: true

- name: "worker 역할 입력 검증"
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups['kubernetes_workers']
      - groups['kubernetes_control_plane'] | default([]) | length > 0
    fail_msg: "kubernetes_workers 및 kubernetes_control_plane Inventory 그룹을 확인하세요."
    quiet: true

- name: "worker 가입 상태 확인"
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _kubernetes_worker_kubelet_conf

- name: "worker join 명령 생성"
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['kubernetes_control_plane'] | first }}"
  register: _kubernetes_worker_join_command
  changed_when: false
  no_log: true
  when: not (_kubernetes_worker_kubelet_conf.stat.exists | bool)

- name: "worker 클러스터 가입"
  ansible.builtin.command: >-
    {{ _kubernetes_worker_join_command.stdout }}
    --cri-socket {{ kubernetes_cri_socket }}
    --node-name {{ kubernetes_node_name }}
    {{ kubernetes_worker_join_extra_args }}
  register: _kubernetes_worker_join
  changed_when: _kubernetes_worker_join.rc == 0
  no_log: true
  when: not (_kubernetes_worker_kubelet_conf.stat.exists | bool)

- name: "worker kubelet 활성 상태 확인"
  ansible.builtin.command: systemctl is-active kubelet
  register: _kubernetes_worker_kubelet_active
  changed_when: false
  failed_when: _kubernetes_worker_kubelet_active.stdout != 'active'
