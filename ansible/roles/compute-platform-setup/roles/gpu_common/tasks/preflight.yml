---
# 설치 전 읽기 전용 점검. 이미지 빌드와 최초 Driver 설치도 허용하기 위해
# 대부분 경고로 처리하며, 명시적으로 활성화한 안전 조건만 실패시킨다.

- name: "Preflight: Secure Boot 상태 확인"
  ansible.builtin.command:
    cmd: mokutil --sb-state
  register: _gpu_preflight_secure_boot
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Preflight: Secure Boot 활성화 경고"
  ansible.builtin.debug:
    msg: >-
      Secure Boot가 활성화되어 있습니다. NVIDIA DKMS 모듈을 로드하려면
      유효한 Machine Owner Key(MOK)가 등록되어 있어야 합니다.
      설치 후 reboot와 MOK 등록 절차를 확인하세요.
  when: "'SecureBoot enabled' in (_gpu_preflight_secure_boot.stdout | default(''))"

- name: "Preflight: 현재 kernel headers 확인"
  ansible.builtin.stat:
    path: "/lib/modules/{{ ansible_facts['kernel'] }}/build"
  register: _gpu_preflight_kernel_headers

- name: "Preflight: kernel headers 미설치 안내"
  ansible.builtin.debug:
    msg: >-
      현재 커널({{ ansible_facts['kernel'] }})의 headers가 아직 없습니다.
      Driver 설치가 활성화되어 있으면 nvidia_driver.yml에서 설치합니다.
  when: not (_gpu_preflight_kernel_headers.stat.exists | default(false))

- name: "Preflight: 로드된 kernel module 확인"
  ansible.builtin.slurp:
    src: /proc/modules
  register: _gpu_preflight_modules_raw

- name: "Preflight: kernel module 상태 저장"
  ansible.builtin.set_fact:
    _gpu_preflight_modules: "{{ _gpu_preflight_modules_raw.content | b64decode }}"
    gpu_nouveau_module_loaded: >-
      {{ 'nouveau' in (_gpu_preflight_modules_raw.content | b64decode).split() }}
    gpu_nvidia_module_loaded: >-
      {{ 'nvidia' in (_gpu_preflight_modules_raw.content | b64decode).split() }}

- name: "Preflight: nouveau module 충돌 경고"
  ansible.builtin.debug:
    msg: >-
      nouveau module이 현재 로드되어 있습니다. NVIDIA Driver 설치 후
      nouveau blacklist 적용과 reboot가 필요합니다.
  when:
    - gpu_nouveau_module_loaded | bool
    - gpu_common_install_driver | bool

- name: "Preflight: 기존 NVIDIA Driver 조회"
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
  register: _gpu_preflight_driver
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Preflight: NVIDIA device node 확인"
  ansible.builtin.stat:
    path: /dev/nvidiactl
  register: _gpu_preflight_device_node

- name: "Preflight: GPU는 감지됐지만 device node가 없는 경우 안내"
  ansible.builtin.debug:
    msg: >-
      NVIDIA PCI 장치는 감지됐지만 /dev/nvidiactl이 없습니다.
      Driver가 아직 로드되지 않았거나 reboot가 필요한 상태일 수 있습니다.
  when:
    - gpu_nvidia_device_present | bool
    - not (_gpu_preflight_device_node.stat.exists | default(false))

- name: "Preflight: root filesystem 정보 선택"
  ansible.builtin.set_fact:
    _gpu_preflight_root_mount: >-
      {{ (ansible_facts['mounts'] | default([])
          | selectattr('mount', 'equalto', '/') | list | first) | default({}) }}

- name: "Preflight: root filesystem 여유 공간 경고"
  ansible.builtin.debug:
    msg: >-
      root filesystem 여유 공간이 {{
      ((_gpu_preflight_root_mount.size_available | int) / 1073741824) | round(1)
      }} GiB입니다. 권장 최소값은 {{ gpu_preflight_min_root_free_gb }} GiB입니다.
  when:
    - _gpu_preflight_root_mount | length > 0
    - (_gpu_preflight_root_mount.size_available | int) < ((gpu_preflight_min_root_free_gb | int) * 1073741824)

- name: "Preflight: root filesystem 최소 여유 공간 검증"
  ansible.builtin.assert:
    that:
      - (_gpu_preflight_root_mount.size_available | int) >= ((gpu_preflight_min_root_free_gb | int) * 1073741824)
    fail_msg: >-
      root filesystem 여유 공간이 {{ gpu_preflight_min_root_free_gb }} GiB보다 작습니다.
    quiet: true
  when:
    - gpu_preflight_fail_on_low_disk | bool
    - _gpu_preflight_root_mount | length > 0

- name: "Preflight: CUDA/Driver 호환성 기준 계산"
  ansible.builtin.set_fact:
    _gpu_preflight_cuda_major: "{{ cuda_version.split('.')[0] }}"
    _gpu_preflight_driver_branch: >-
      {{ ((nvidia_driver_version
           if gpu_common_install_driver | bool and nvidia_driver_version | string | length > 0
           else (_gpu_preflight_driver.stdout_lines | default([]) | first | default('0')))
          | string).split('.')[0] }}
  when: gpu_common_install_cuda | bool

- name: "Preflight: CUDA/Driver 최소 호환성 검증"
  ansible.builtin.assert:
    that:
      - (_gpu_preflight_driver_branch | int) >= (gpu_cuda_min_driver_branches[_gpu_preflight_cuda_major] | int)
    fail_msg: >-
      CUDA {{ cuda_version }}에는 최소 Driver branch
      {{ gpu_cuda_min_driver_branches[_gpu_preflight_cuda_major] }}가 필요하지만
      선택된/감지된 branch는 {{ _gpu_preflight_driver_branch }}입니다.
    quiet: true
  when:
    - gpu_common_install_cuda | bool
    - _gpu_preflight_cuda_major in gpu_cuda_min_driver_branches
    - not (gpu_common_install_driver | bool and nvidia_driver_version | string | length == 0)

- name: "Preflight 결과 요약"
  ansible.builtin.debug:
    msg:
      - "NVIDIA PCI device : {{ gpu_nvidia_device_present }}"
      - "NVIDIA module     : {{ gpu_nvidia_module_loaded }}"
      - "nouveau module    : {{ gpu_nouveau_module_loaded }}"
      - "existing driver   : {{ _gpu_preflight_driver.stdout_lines | default([]) | first | default('not loaded') }}"
      - "Secure Boot       : {{ _gpu_preflight_secure_boot.stdout | default('unknown') | trim }}"
