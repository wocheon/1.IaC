apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-worker-01-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Worker 01</title>
    </head>
    <body>
      <h1>Hello from Worker 01</h1>
      <p>This Pod is running on worker-01</p>
    </body>
    </html>

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-worker-02-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Worker 02</title>
    </head>
    <body>
      <h1>Hello from Worker 02</h1>
      <p>This Pod is running on worker-02</p>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-worker-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-worker-01
  template:
    metadata:
      labels:
        app: nginx-worker-01
    spec:
      nodeSelector:
        test-node: worker-01

      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

      volumes:
        - name: html
          configMap:
            name: nginx-worker-01-page

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-worker-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-worker-02
  template:
    metadata:
      labels:
        app: nginx-worker-02
    spec:
      nodeSelector:
        test-node: worker-02

      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

      volumes:
        - name: html
          configMap:
            name: nginx-worker-02-page

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-worker-01
spec:
  type: NodePort
  selector:
    app: nginx-worker-01
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-worker-02
spec:
  type: NodePort
  selector:
    app: nginx-worker-02
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082